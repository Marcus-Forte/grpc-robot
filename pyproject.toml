[project]
name = "grpc-robot"
version = "0.1.0"
description = "Add your description here"
readme = "readme.md"
requires-python = ">=3.14"
dependencies = [
    "black>=25.12.0",
    "gpiozero>=2.0.1",
    "grpcio-tools>=1.76.0",
    "lgpio>=0.2.2.0",
    "ruff>=0.14.9",
]

[tool.ruff]
exclude = ["proto_gen"]

[tool.black]
line-length = 100
target-version = ["py313", "py314"]
extend-exclude = "proto_gen*"
